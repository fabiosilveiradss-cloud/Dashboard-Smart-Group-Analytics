<!DOCTYPE html>
<html lang="pt-BR">
<head>

        content="width=device-width, initial-scale=1.0"

    <title>Compras e Suprimentos</title>
    <link rel="stylesheet" href="compras.css?v=1">
    <style>
        html { visibility: hidden; }
    </style>
</head>

<body>

    <main class="compras-modulo">

        <div class="compras-barra">
            <span>Análise Integrada de Suprimentos</span>

            <a
                href="https://smartstocksight.onrender.com"
                target="_blank"
                rel="noopener noreferrer"

        <iframe
            src="https://smartstocksight.onrender.com"
            title="Análise Integrada de Suprimentos"
            loading="eager"
            allow="fullscreen"

    <script type="module">

        import {
            protegerModulo
        } from "../../module-guard.js?v=3";

        try {
            await protegerModulo("compras");

            console.warn(

        }
